name: ViggoPlusPhone
options:
  bundleIdPrefix: com.ottobigo
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: M9H38A3AGD
    # The Mac app's iPhone installer overrides these two for other Apple IDs.
    VIGGO_PREFIX: com.ottobigo
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.8.0"
    CURRENT_PROJECT_VERSION: "1"
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
targets:
  ViggoPlus:
    type: application
    platform: iOS
    sources:
      - path: ../Shared
      - path: Sources
      - path: Assets.xcassets
      - path: Widget/WidgetData.swift
      - path: Widget/WidgetViews.swift
      - path: Widget/LiveData.swift
      - path: Widget/LiveViews.swift
      - path: Widget/LiveStart.swift
      - path: Widget/OpenIntents.swift
      - path: Widget/HomeworkIntent.swift
      - path: Widget/HomeworkWidget.swift
      - path: Widget/BirthdayWidget.swift
    dependencies:
      - target: ViggoWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VIGGO_PREFIX).viggoplus.ios
        CODE_SIGN_ENTITLEMENTS: App.entitlements
        INFOPLIST_FILE: App-Info.plist
        PRODUCT_NAME: Viggo+
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Viggo+
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Viggo+ kan lægge dit skema i Kalender.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
  ViggoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VIGGO_PREFIX).viggoplus.ios.widget
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET
        PRODUCT_NAME: ViggoWidget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
